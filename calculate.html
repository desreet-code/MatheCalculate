<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="A fast, free online web calculator for math equations, school assignments, and homework. Simple layout with easy tools.">
    <meta name="keywords" content="online calculator, web calculator, free math tool, simple calculator">
    <meta name="author" content="Lindokuhle Moabelo">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatheCalculate</title>
    <audio src="Button sound.mp3" id="BtnSound"></audio>
    <audio src="Error.mp3" id="Error"></audio>
    <link rel="stylesheet" href="calculate.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d8ff22cf97.js" crossorigin="anonymous"></script>
</head>
<body>
    <p style="font-weight: bold; margin-left: 10px; color: white;"><span style="color: silver; font-size: larger;">Welcome To MatheCalculate</span> <br><br> This is a place where you can just calculate simple questions and to help you learn how do simpel calculations help you kids.🧮➕➖✖➗📚🏫😊<br><br><span id="source" processWordClick()>Recources used</span></p>
    <div id="calculator">
        <input id="display" type="text" placeholder="Calculate" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('+')" class="operator-btn"><i class="fa-solid fa-plus"></i></button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')" class="operator-btn"><i class="fa-solid fa-minus"></i></button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operator-btn"><i class="fa-solid fa-xmark"></i></button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')" class="operator-btn"><i class="fa-solid fa-divide"></i></button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="appendToDisplay('(')">(</button>
            <button onclick="appendToDisplay(')')">)</button>
            <button onclick="deleteDisplayvalue('delete')" class="operator-btn"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="calculate()" class="operator-btn"><i class="fa-solid fa-bolt"></i><i class="fa-solid fa-equals"></i></button>
            <button onclick="clearDisplay()" class="operator-btn"><i class="fa-solid fa-eraser"></i><i class="fa-solid fa-c"></i></button>
        </div>
    </div>

    <script src="calculate.js"></script>
</body>
</html>
